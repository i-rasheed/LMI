# Lagos Market Intelligence — Supabase local config
# See: https://supabase.com/docs/guides/cli/config

project_id = "lmi"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["lmi://", "lmi://auth/callback", "exp://"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = true
enable_confirmations = false
# Configure Twilio/MessageBird in the hosted Supabase dashboard for real SMS.
# Local CLI SMS testing can use the inbucket/Studio OTP view or provider-specific
# [auth.sms.twilio] settings documented by Supabase.

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "5MiB"
